rules:
  # prow.yml triggers on issue_comment because Prow commands (/lgtm, /approve,
  # /kind, ...) are issue and pull request comments. This is the safe pattern:
  # nothing checks out or runs pull request code — the action only calls the
  # GitHub API, and commands are authorized against the OWNERS file before
  # anything is applied.
  dangerous-triggers:
    ignore:
      - prow.yml
