version: 2
updates:
  # kind/dependencies satisfies the needs-kind rule in .github/prow.yaml.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels: ["kind/dependencies"]
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    labels: ["kind/dependencies"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    labels: ["kind/dependencies"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["kind/dependencies"]
